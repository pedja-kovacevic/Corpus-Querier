name: Publish release notes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release-notes.yml"
      - "RELEASE_NOTES_3.0.1.md"

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5
      - name: Update the public release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.0.1 \
            --title "Corpus Querier 3.0.1" \
            --notes-file RELEASE_NOTES_3.0.1.md
