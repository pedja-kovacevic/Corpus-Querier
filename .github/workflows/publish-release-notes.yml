name: Publish release notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix
        required: true
        default: 3.1.2

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-22.04
    steps:
      # Replaces generated appendices so the public release page stays concise.
      - name: Check out release notes
        uses: actions/checkout@v5
      - name: Update the public release page
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          test -f "$NOTES_FILE"
          gh release edit "v${VERSION}" \
            --title "Corpus Querier ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest
