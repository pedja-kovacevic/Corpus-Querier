name: Publish release notes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-22.04
    steps:
      # Replaces generated appendices so the public release page stays concise.
      - name: Check out release notes
        uses: actions/checkout@v5
      - name: Update the public release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v3.1.0 \
            --title "Corpus Querier 3.1.0" \
            --notes-file RELEASE_NOTES_3.1.0.md
