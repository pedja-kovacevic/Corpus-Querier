name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the installer to (optional)
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest -v test_rnc_cql_translator.py test_corpus_querier_rnc.py test_rnc_transport_retries.py test_dataframe_compatibility.py test_noske_provider.py test_sketchengine_provider.py test_run_control.py test_app_identity.py
      - name: Build standalone application
        run: python -m PyInstaller --noconfirm --clean CorpusQuerier.spec
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\CorpusQuerier.iss"'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: Corpus-Querier-Windows-Installer
          path: installer-output/Corpus-Querier-Setup.exe
          if-no-files-found: error
      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: installer-output/Corpus-Querier-Setup.exe
          generate_release_notes: true
