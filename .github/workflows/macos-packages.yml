name: Build macOS packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest -v test_rnc_cql_translator.py test_corpus_querier_rnc.py test_rnc_transport_retries.py test_dataframe_compatibility.py test_clarin_provider.py test_sketchengine_provider.py test_app_identity.py
      - name: Build macOS application
        run: python -m PyInstaller --noconfirm --clean CorpusQuerier.spec
      - name: Package application as a DMG
        run: bash macos/build_macos_package.sh "${{ matrix.architecture }}"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Corpus-Querier-macOS-${{ matrix.architecture }}
          path: macos-output/Corpus-Querier-macOS-${{ matrix.architecture }}.dmg
          if-no-files-found: error
      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: macos-output/Corpus-Querier-macOS-${{ matrix.architecture }}.dmg
          generate_release_notes: true
