name: Build Linux packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: 3.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest -v test_rnc_cql_translator.py test_corpus_querier_rnc.py test_dataframe_compatibility.py test_clarin_provider.py test_sketchengine_provider.py test_app_identity.py test_linux_packaging.py
      - name: Build standalone Linux application
        run: python -m PyInstaller --noconfirm --clean CorpusQuerier.spec
      - name: Download AppImage packaging tool
        run: |
          curl --fail --location --output appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build AppImage and Debian package
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then VERSION="3.1.0"; fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash linux/build_linux_packages.sh "$VERSION"
      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Corpus-Querier-Linux-Packages
          path: |
            linux-output/Corpus-Querier-x86_64.AppImage
            linux-output/corpus-querier_*_amd64.deb
          if-no-files-found: error
      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-output/Corpus-Querier-x86_64.AppImage
            linux-output/corpus-querier_*_amd64.deb
          generate_release_notes: true
